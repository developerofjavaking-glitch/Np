<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভিডিও প্লেয়ার</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; }
        h1 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        
        .player-wrap {
            max-width: 850px;
            margin: 0 auto 30px auto;
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            display: none;
        }
        video { width: 100%; border-radius: 8px; max-height: 480px; background: #000; }
        #nowPlaying { margin-top: 10px; font-size: 16px; color: #94a3b8; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .card {
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #334155;
            transition: 0.2s;
        }
        .card:hover { border-color: #38bdf8; transform: scale(1.02); }
        .thumb { height: 135px; background: #000; position: relative; }
        .thumb video { width: 100%; height: 100%; object-fit: cover; }
        .icon {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 35px; color: white; opacity: 0.85;
        }
        .title { padding: 12px; font-size: 14px; word-break: break-word; }
    </style>
</head>
<body>

    <h1>রুট ফোল্ডারের ভিডিওসমূহ</h1>

    <div class="player-wrap" id="playerWrap">
        <video id="videoPlayer" controls></video>
        <div id="nowPlaying"></div>
    </div>

    <div class="grid" id="videoGrid"></div>

    <script>
        // রুট ফোল্ডারে থাকা আপনার ভিডিও ফাইলগুলোর নাম এখানে লিখুন
        const videoFiles = [
            "video1.mp4",
            "movie.mp4",
            "tutorial.webm"
        ];

        const grid = document.getElementById('videoGrid');
        const playerWrap = document.getElementById('playerWrap');
        const videoPlayer = document.getElementById('videoPlayer');
        const nowPlaying = document.getElementById('nowPlaying');

        videoFiles.forEach(file => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="thumb">
                    <video src="${file}#t=1" preload="metadata" muted></video>
                    <div class="icon">▶</div>
                </div>
                <div class="title">${file}</div>
            `;
            card.onclick = () => {
                playerWrap.style.display = 'block';
                videoPlayer.src = file;
                nowPlaying.innerText = "প্লেইং: " + file;
                videoPlayer.play();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };
            grid.appendChild(card);
        });
    </script>

</body>
</html>
